services:
  web:
    build: .
    ports:
      - "4173:4173"
    healthcheck:
      # The slim image has no wget/curl; Node 22 has fetch.
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4173/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 2s
      timeout: 2s
      retries: 30
